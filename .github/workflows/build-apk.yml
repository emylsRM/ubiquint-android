name: Build APK privato

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'versionCode (aumentalo solo se cambi nome/icona/config)'
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ubiquint' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Chiave di firma (usa i Secrets o ne genera una nuova)
        id: key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p out/chiave
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ubiquint.keystore
            echo "generated=false" >> $GITHUB_OUTPUT
          else
            KS_PASS=$(openssl rand -hex 16)
            K_PASS=$KS_PASS
            keytool -genkeypair -v -keystore ubiquint.keystore -storetype PKCS12 \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$K_PASS" \
              -dname "CN=UBIQUINT, O=UBIQUINT, C=IT"
            cp ubiquint.keystore out/chiave/
            base64 -w0 ubiquint.keystore > out/chiave/KEYSTORE_BASE64.txt
            printf 'KEYSTORE_PASSWORD=%s\nKEY_PASSWORD=%s\nKEY_ALIAS=%s\n' "$KS_PASS" "$K_PASS" "$KEY_ALIAS" > out/chiave/credenziali.txt
            echo "generated=true" >> $GITHUB_OUTPUT
          fi
          echo "::add-mask::$KS_PASS"
          echo "KS_PASS=$KS_PASS" >> $GITHUB_ENV
          echo "K_PASS=$K_PASS" >> $GITHUB_ENV
          SHA=$(keytool -list -v -keystore ubiquint.keystore -alias "$KEY_ALIAS" -storepass "$KS_PASS" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          mkdir -p out/sito/.well-known
          cat > out/sito/.well-known/assetlinks.json <<EOF
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "it.ubiquint.app",
              "sha256_cert_fingerprints": ["$SHA"]
            }
          }]
          EOF
          echo "Impronta SHA256: $SHA"

      - name: Icone provvisorie (SVG -> PNG)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          mkdir -p iconsrv out/sito/icons
          rsvg-convert -w 192 -h 192 icons/icon.svg -o iconsrv/icon-192.png
          rsvg-convert -w 512 -h 512 icons/icon.svg -o iconsrv/icon-512.png
          rsvg-convert -w 512 -h 512 icons/maskable.svg -o iconsrv/maskable-512.png
          cp iconsrv/*.png out/sito/icons/
          (cd iconsrv && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2

      - name: Genera progetto Android (Bubblewrap)
        env:
          VERSION_CODE: ${{ github.event.inputs.versionCode }}
          KS_PATH: ${{ github.workspace }}/ubiquint.keystore
        run: |
          npm install --no-save @bubblewrap/core@1
          node scripts/generate-twa.cjs

      - name: Compila APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Firma APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -f -p 4 "$IN" aligned.apk
          mkdir -p out/apk
          $BT/apksigner sign --ks ubiquint.keystore --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:K_PASS \
            --out out/apk/ubiquint-v${{ github.event.inputs.versionCode }}.apk aligned.apk
          $BT/apksigner verify out/apk/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ubiquint-apk
          path: out/apk/

      - uses: actions/upload-artifact@v4
        with:
          name: file-per-il-sito
          path: out/sito/
          include-hidden-files: true

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.generated == 'true'
        with:
          name: CHIAVE-PRIVATA-da-conservare
          path: out/chiave/
          retention-days: 3
