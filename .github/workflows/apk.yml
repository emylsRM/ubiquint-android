name: APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # serve solo per allegare l'APK alle release dei tag v*

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Strumenti Android (pacchetti Ubuntu, come in build.sh)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-platform-23 aapt dalvik-exchange zipalign apksigner

      # Secrets UBQ_* (README); valgono anche i nomi della vecchia configurazione TWA (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS)
      - name: Chiave di firma dai secrets
        env:
          UBQ_KEYSTORE_B64: ${{ secrets.UBQ_KEYSTORE_B64 || secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UBQ_KEYSTORE_B64" ]; then
            printf '%s' "$UBQ_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ubiquint.keystore"
            echo "UBQ_KEYSTORE=$RUNNER_TEMP/ubiquint.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret UBQ_KEYSTORE_B64 assente: APK firmata con una chiave di prova, non si installa sopra quella firmata con la tua chiave."
          fi

      - name: APK
        env:
          UBQ_KEYSTORE_PASS: ${{ secrets.UBQ_KEYSTORE_PASS || secrets.KEYSTORE_PASSWORD }}
          UBQ_KEY_PASS: ${{ secrets.UBQ_KEY_PASS || secrets.KEY_PASSWORD }}
          UBQ_KEY_ALIAS: ${{ secrets.UBQ_KEY_ALIAS || secrets.KEY_ALIAS }}
        run: bash build.sh

      - name: Prove delle regole dell'app (JVM)
        run: bash test/run_tests.sh

      - uses: actions/upload-artifact@v4
        with:
          name: UBIQUINT-apk
          path: build/UBIQUINT-*.apk
          if-no-files-found: error

      - name: Release con l'APK (solo tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "UBIQUINT $GITHUB_REF_NAME" --notes "APK firmata per Android 7 e successivi."
          gh release upload "$GITHUB_REF_NAME" build/UBIQUINT-*.apk --clobber
