name: APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # serve solo per allegare l'APK alle release dei tag v*

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Strumenti Android (pacchetti Ubuntu, come in build.sh)
        # prima con gli indici già presenti sul runner (pochi secondi); solo se mancano si aggiornano
        run: |
          PKG="android-sdk-platform-23 aapt dalvik-exchange zipalign apksigner dexdump"
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 $PKG \
            || { sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 $PKG; }

      # Secrets UBQ_* (README); valgono anche i nomi della vecchia configurazione TWA (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS)
      - name: Chiave di firma dai secrets
        env:
          UBQ_KEYSTORE_B64: ${{ secrets.UBQ_KEYSTORE_B64 || secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UBQ_KEYSTORE_B64" ]; then
            printf '%s' "$UBQ_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ubiquint.keystore"
            echo "UBQ_KEYSTORE=$RUNNER_TEMP/ubiquint.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret UBQ_KEYSTORE_B64 assente: APK firmata con una chiave di prova, non si installa sopra quella firmata con la tua chiave."
          fi

      - name: APK
        env:
          UBQ_KEYSTORE_PASS: ${{ secrets.UBQ_KEYSTORE_PASS || secrets.KEYSTORE_PASSWORD }}
          UBQ_KEY_PASS: ${{ secrets.UBQ_KEY_PASS || secrets.KEY_PASSWORD }}
          UBQ_KEY_ALIAS: ${{ secrets.UBQ_KEY_ALIAS || secrets.KEY_ALIAS }}
        run: bash build.sh

      - name: Prove delle regole dell'app (JVM)
        run: bash test/run_tests.sh

      - name: Verifica dell'APK
        run: |
          APK=$(ls build/UBIQUINT-*.apk)
          aapt dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|launchable)"
          zipalign -c -p 4 "$APK" && echo "allineamento a 4 byte: OK"
          apksigner verify -v --min-sdk-version 24 "$APK" | grep -E "v2|v3|signers"
          apksigner verify --print-certs "$APK" | grep -E "DN|SHA-256"
          unzip -p "$APK" classes.dex > "$RUNNER_TEMP/classes.dex"
          N=$(dexdump -a "$RUNNER_TEMP/classes.dex" | grep -c 'Landroid/webkit/JavascriptInterface;')
          echo "metodi @JavascriptInterface: $N"; [ "$N" -eq 5 ]
          sha256sum "$APK"

      - uses: actions/upload-artifact@v5
        with:
          name: UBIQUINT-apk
          path: build/UBIQUINT-*.apk
          if-no-files-found: error

      - name: Release con l'APK (solo tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "UBIQUINT $GITHUB_REF_NAME" --notes "APK firmata per Android 7 e successivi."
          gh release upload "$GITHUB_REF_NAME" build/UBIQUINT-*.apk --clobber
