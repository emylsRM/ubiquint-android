<!doctype html>
<html lang="it">
<head>

<title>UBIQUINT · accesso dall'app Android</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222%22%20fill%3D%22%230b0818%22%2F%3E%3Cg%20transform%3D%22translate(9%208)%20scale(.82)%22%3E%3Cpath%20d%3D%22M42%2018Q42%2026%2042%2034L42%2050A8%208%200%200%200%2058%2050L58%2034Q58%2026%2058%2018%22%20fill%3D%22none%22%20stroke%3D%22%2396f4ff%22%20stroke-width%3D%228%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M33%2018Q33%2026%2033%2034L33%2047.5A17%2017%200%200%200%2067%2047.5L67%2034Q67%2026%2067%2018%22%20fill%3D%22none%22%20stroke%3D%22%23c9b8ff%22%20stroke-width%3D%226.5%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M24%2018Q24%2026%2024%2034L24%2045A26%2026%200%200%200%2076%2045L76%2034Q76%2026%2076%2018%22%20fill%3D%22none%22%20stroke%3D%22%23c9b8ff%22%20stroke-width%3D%226.5%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M15%2018Q15%2026%2015%2034L15%2042.5A35%2035%200%200%200%2085%2042.5L85%2034Q85%2026%2085%2018%22%20fill%3D%22none%22%20stroke%3D%22%23c9b8ff%22%20stroke-width%3D%226.5%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#02040a;--text:#f1edff;--muted:#98a7c3;--uv:167,139,250;--gold-bright:#f0c94a;--err:#ff8a8a;--mono:'JetBrains Mono',Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--text)}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;
  background:radial-gradient(ellipse 80% 55% at 50% 38%,rgba(var(--uv),.13),transparent 70%),var(--bg);font-family:var(--mono)}
main{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;text-align:center}
.mark{width:104px;height:104px;filter:drop-shadow(0 0 18px rgba(var(--uv),.55))}
h1{font-family:'Syne',sans-serif;font-weight:800;font-size:44px;letter-spacing:.06em;line-height:1.1;margin:22px 0 14px;
  text-shadow:0 0 34px rgba(var(--uv),.7)}
.tag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#c9b8ff;margin-bottom:38px}
#msg{font-size:14px;line-height:1.65;margin-bottom:26px;max-width:34ch}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:52px;padding:14px 22px;border:none;border-radius:3px;
  background:#f1edff;color:#150f33;font:700 13px/1.2 'Syne',sans-serif;letter-spacing:2px;text-transform:uppercase;text-decoration:none;cursor:pointer;
  box-shadow:0 0 54px rgba(var(--uv),.35);-webkit-tap-highlight-color:transparent}
.btn:focus-visible{outline:2px solid #c9b8ff;outline-offset:4px}
.btn[disabled]{opacity:.55;cursor:progress}
.btn svg{width:20px;height:20px;flex-shrink:0}
#err{color:var(--err);font-size:12.5px;line-height:1.6;margin-top:18px}
.hint{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);line-height:1.8;margin-top:30px;max-width:340px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
    <path d="M42 18Q42 26 42 34L42 50A8 8 0 0 0 58 50L58 34Q58 26 58 18" fill="none" stroke="#96f4ff" stroke-width="7" stroke-linecap="round"/>
    <path d="M33 18Q33 26 33 34L33 47.5A17 17 0 0 0 67 47.5L67 34Q67 26 67 18" fill="none" stroke="#c9b8ff" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M24 18Q24 26 24 34L24 45A26 26 0 0 0 76 45L76 34Q76 26 76 18" fill="none" stroke="#c9b8ff" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M15 18Q15 26 15 34L15 42.5A35 35 0 0 0 85 42.5L85 34Q85 26 85 18" fill="none" stroke="#c9b8ff" stroke-width="5.5" stroke-linecap="round"/>
  </svg>
  <h1>UBIQUINT</h1>
  <div class="tag">Accesso dall'app Android</div>
  <p id="msg">Accedi con il tuo account Google: subito dopo torni nell'app UBIQUINT.</p>
  <button class="btn" id="go" type="button" disabled>
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/>
      <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
      <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.3 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.6 39.6 16.2 44 24 44z"/>
      <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.3-.4-3.5z"/>
    </svg>
    Accedi con Google
  </button>
  <a class="btn" id="back" href="#" hidden>Torna all'app UBIQUINT</a>
  <p id="err" role="alert" hidden></p>
  <div class="hint">Accesso riservato ad analisti autorizzati.<br>Il controllo dei domini ammessi avviene nell'app.</div>
  <noscript><p class="hint">Per accedere serve JavaScript.</p></noscript>
</main>
<script type="module">
/* Pagina di passaggio per l'app Android: nella WebView Google blocca il login, quindi l'app apre questa pagina nel browser.
   Qui si fa signInWithPopup come nella web app, si prendono le credenziali Google e si restituiscono SOLO all'app UBIQUINT
   (intent:// con package esplicito), insieme allo stato monouso generato dall'app. Nulla resta salvato nel browser. */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { initializeAuth, inMemoryPersistence, browserPopupRedirectResolver, signInWithPopup, signOut, GoogleAuthProvider } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

const ANDROID_PACKAGE = 'it.ubiquint.app';   // deve coincidere con il package dell'APK
const firebaseConfig = {
  apiKey: "AIzaSyBOdaq8t2vXD7UcSFLSvGb9Ce6fwjd7_CE",
  authDomain: "ubiquint.firebaseapp.com",
  projectId: "ubiquint",
  storageBucket: "ubiquint.firebasestorage.app",
  messagingSenderId: "1093739680877",
  appId: "1:1093739680877:web:9ab3f127da195eeab19b64"
};
const ERRORS = {
  'auth/popup-closed-by-user': 'La finestra di Google è stata chiusa prima di completare l\'accesso. Riprova.',
  'auth/cancelled-popup-request': 'La finestra di Google è stata chiusa prima di completare l\'accesso. Riprova.',
  'auth/popup-blocked': 'Il browser ha bloccato la finestra di Google: consenti i popup per questo sito e riprova.',
  'auth/network-request-failed': 'Rete non disponibile: controlla la connessione e riprova.',
  'auth/unauthorized-domain': 'Questo indirizzo non è tra i domini autorizzati di Firebase (Authentication › Settings › Authorized domains).',
  'auth/operation-not-allowed': 'L\'accesso con Google non è attivo nel progetto Firebase.',
  'auth/user-disabled': 'Questo account è stato disattivato.',
  'auth/internal-error': 'Impossibile contattare Google in questo momento: ricarica la pagina e riprova.'
};
const $ = id => document.getElementById(id);
const m = /^#s=([0-9a-f]{32})$/.exec(location.hash);
const state = m ? m[1] : null;
if (location.hash) history.replaceState(null, '', location.pathname + location.search);   // lo stato non resta nella barra né nella cronologia

function fail(text) { $('err').textContent = text; $('err').hidden = false; }

if (!state) {
  $('go').hidden = true;
  $('msg').textContent = 'Questa pagina si apre dal pulsante «Accedi con Google» dell\'app UBIQUINT per Android.';
} else {
  const auth = initializeAuth(initializeApp(firebaseConfig), { persistence: inMemoryPersistence, popupRedirectResolver: browserPopupRedirectResolver });
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  $('go').disabled = false;
  $('go').addEventListener('click', async () => {
    $('go').disabled = true;
    $('err').hidden = true;
    try {
      const res = await signInWithPopup(auth, provider);
      const cred = GoogleAuthProvider.credentialFromResult(res);
      if (!cred || !(cred.idToken || cred.accessToken)) throw new Error('Google non ha restituito le credenziali: riprova.');
      const who = (res.user && (res.user.email || res.user.displayName)) || '';
      const url = 'intent://login?s=' + state + '&id=' + encodeURIComponent(cred.idToken || '') + '&at=' + encodeURIComponent(cred.accessToken || '')
        + '#Intent;scheme=ubiquint;package=' + ANDROID_PACKAGE + ';end';
      await signOut(auth).catch(() => {});
      $('back').href = url;
      $('back').hidden = false;
      $('go').hidden = true;
      $('msg').textContent = (who ? 'Accesso come ' + who + '.' : 'Accesso riuscito.') + ' Se l\'app non si riapre da sola, tocca il pulsante qui sotto.';
      location.href = url;
    } catch (e) {
      $('go').disabled = false;
      fail(ERRORS[e && e.code] || ('Accesso non riuscito: ' + ((e && e.message) || e)));
    }
  });
}
</script>
</body>
</html>
