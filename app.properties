# Impostazioni dell'app UBIQUINT per Android (lette da build.sh)
# Indirizzo pubblicato della web app (Cloudflare Pages). Deve essere l'indirizzo finale, senza reindirizzamenti.
APP_URL=https://ubiquint.pages.dev/
# Pagina di accesso con Google da pubblicare accanto a index.html (file web/android-login.html)
LOGIN_PATH=android-login.html
# Versione: aumenta VERSION_CODE di 1 a ogni nuova APK, altrimenti Android non la installa sopra la precedente
VERSION_NAME=1.0.0
VERSION_CODE=1
